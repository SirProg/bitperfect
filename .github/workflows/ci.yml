name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # El postinstall copia los binarios de ffmpeg.wasm a public/ffmpeg/.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # El catálogo de formatos afirma qué encoders trae el core. Si una subida
      # de @ffmpeg/core los cambiara, esto lo deja a la vista en el log en vez
      # de fallar en producción.
      - name: Auditar encoders del core
        run: npm run audit:encoders | grep -E '^ [A-Z.]+ +(libmp3lame|aac|libvorbis|libopus|flac|alac|pcm_s16le|pcm_s24le|pcm_s16be) '

  # El worker es un servicio Python aparte. Solo se comprueba cuando cambia:
  # no tiene sentido levantar Python en cada retoque del frontend.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Ha cambiado el worker?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -q '^worker/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.changed.outputs.run == 'true'
        working-directory: worker
        run: pip install -r requirements-dev.txt

      - name: Lint
        if: steps.changed.outputs.run == 'true'
        working-directory: worker
        run: ruff check .

      - name: Tests
        if: steps.changed.outputs.run == 'true'
        working-directory: worker
        run: pytest -q

      - name: Construir la imagen
        if: steps.changed.outputs.run == 'true'
        working-directory: worker
        run: docker build -t bitperfect-worker .
